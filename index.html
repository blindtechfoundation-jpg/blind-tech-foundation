<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind Tech Foundation</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --card: #1c1c1c;
      --primary: #ffd700;
      --text: #ffffff;
      --border: #ffd700;
      --accent: #00e5ff;
      --btn-green: #00c853;
      --btn-red: #d50000;
      --btn-blue: #2979ff;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --card: #e0e0e0;
      --primary: #000000;
      --text: #000000;
      --border: #000000;
      --accent: #d50000;
      --btn-green: #2e7d32;
      --btn-red: #c62828;
      --btn-blue: #1565c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 22px;
      margin-bottom: 8px;
    }
    .field { margin-bottom: 8px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 4px;
    }
    select, textarea {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      outline: none;
    }
    textarea { height: 110px; resize: vertical; }
    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--primary);
      margin-top: 4px;
    }
    #readingDisplay {
      display: none;
      min-height: 44px;
      padding: 8px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
      line-height: 1.4;
    }
    .active-word {
      background-color: var(--primary);
      color: var(--bg);
      font-weight: bold;
      padding: 0 2px;
      border-radius: 2px;
    }
    .hub-wrapper {
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      margin: 10px 0;
      overflow: hidden;
    }
    .hub-header {
      background: var(--primary);
      color: var(--bg);
      padding: 14px;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .hub-inner { padding: 10px; }
    .grid-hub {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button.tool-btn {
      min-height: 50px;
      padding: 6px 4px;
      background: var(--card);
      color: var(--primary);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    button.tool-btn:active { background: var(--primary); color: var(--bg); }
    button.green { background: var(--btn-green); color: #fff; border-color: var(--btn-green); }
    button.red { background: var(--btn-red); color: #fff; border-color: var(--btn-red); }
    button.blue { background: var(--btn-blue); color: #fff; border-color: var(--btn-blue); }
    .col-span-2 { grid-column: span 2; }
    #status {
      margin-top: auto;
      padding: 8px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
    }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <h1>Blind Tech Foundation</h1>

  <div class="field">
    <label for="voiceSelect">Language / Voice Engine:</label>
    <select id="voiceSelect"></select>
  </div>

  <div class="field">
    <label for="mainInput">Text Content:</label>
    <textarea id="mainInput" maxlength="10000" placeholder="Type, paste, dictate, or import text here..."></textarea>
    <div class="meta-row">
      <span id="charCount">0 / 10000</span>
      <span id="langNotice">Script: Auto</span>
    </div>
  </div>

  <div id="readingDisplay" aria-live="polite"></div>

  <div class="hub-wrapper">
    <div class="hub-header">
      ⚡ ACCESS HUB (ALL 20 FEATURES INSIDE)
    </div>
    <div class="hub-inner">
      <div class="grid-hub">
        <button type="button" class="tool-btn green" onclick="f1_tts()">1. Text to Speech</button>
        <button type="button" class="tool-btn blue" onclick="f2_stt()">2. Speech to Text</button>
        <button type="button" class="tool-btn" onclick="document.getElementById('imgInput').click()">3. Camera OCR</button>
        <button type="button" class="tool-btn" onclick="document.getElementById('pdfInput').click()">4. PDF Reader</button>
        <button type="button" class="tool-btn" onclick="document.getElementById('docInput').click()">5. File Importer</button>
        <button type="button" class="tool-btn" onclick="f6_translate()">6. Indic Translator</button>
        <button type="button" class="tool-btn" onclick="f7_summarize()">7. NLP Summarizer</button>
        <button type="button" class="tool-btn green" onclick="f8_exportAudio()">8. Export Audio WAV</button>
        <button type="button" class="tool-btn blue" onclick="f9_share()">9. Share Sheet</button>
        <button type="button" class="tool-btn" onclick="f10_paste()">10. Clipboard Reader</button>
        <button type="button" class="tool-btn" onclick="f11_magnifier()">11. Font Magnifier</button>
        <button type="button" class="tool-btn" onclick="f12_theme()">12. Contrast Theme</button>
        <button type="button" class="tool-btn" onclick="f13_wakeLock()">13. Screen Wake Lock</button>
        <button type="button" class="tool-btn" onclick="f14_sleepTimer()">14. Audio Sleep Timer</button>
        <button type="button" class="tool-btn" onclick="f15_voiceRecord()">15. Voice Recorder</button>
        <button type="button" class="tool-btn" onclick="f16_pronounce()">16. Pronounce Word</button>
        <button type="button" class="tool-btn" onclick="f17_haptic()">17. Haptic Buzz</button>
        <button type="button" class="tool-btn" onclick="f18_history()">18. Offline History</button>
        <button type="button" class="tool-btn" onclick="f19_highlight()">19. Live Highlighter</button>
        <button type="button" class="tool-btn red col-span-2" onclick="f20_sos()">20. Emergency SOS</button>
      </div>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite">Ready. All 20 features ready.</div>

  <input type="file" id="imgInput" accept="image/*" capture="environment" onchange="f3_ocr(event)">
  <input type="file" id="pdfInput" accept=".pdf" onchange="f4_pdf(event)">
  <input type="file" id="docInput" accept=".txt,.json,.csv,.md" onchange="f5_doc(event)">

  <script>
    const synth = window.speechSynthesis;
    let voices = [];
    let activeUtterance = null;
    let heartbeatTimer = null;
    let recognition = null;
    let isDictating = false;
    let wakeLockSentinel = null;
    let sleepTimerRef = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let highlighterOn = true;
    let cachedWavBlob = null;
    let fontSizes = [16, 20, 24, 28];
    let fontIdx = 0;

    const mainInput = document.getElementById('mainInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const statusBox = document.getElementById('status');
    const charCount = document.getElementById('charCount');
    const langNotice = document.getElementById('langNotice');
    const readingDisplay = document.getElementById('readingDisplay');

    function notify(text, pattern = [40]) {
      statusBox.textContent = text;
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    window.addEventListener('load', () => {
      const saved = localStorage.getItem('access_hub_data');
      if (saved) {
        mainInput.value = saved;
        updateStats();
      }
      loadVoices();
    });

    function loadVoices() {
      voices = synth.getVoices();
      voiceSelect.innerHTML = '';
      if (!voices.length) {
        const opt = document.createElement('option');
        opt.value = "";
        opt.textContent = "Default Android Voice";
        voiceSelect.appendChild(opt);
        return;
      }
      voices.forEach((v) => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });
    }
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    mainInput.addEventListener('input', updateStats);
    function updateStats() {
      const val = mainInput.value;
      charCount.textContent = `${val.length} / 10000`;
      localStorage.setItem('access_hub_data', val);

      if (/[\u0900-\u097F]/.test(val)) langNotice.textContent = "Script: Hindi/Devanagari";
      else if (/[\u0B80-\u0BFF]/.test(val)) langNotice.textContent = "Script: Tamil";
      else if (/[\u0C00-\u0C7F]/.test(val)) langNotice.textContent = "Script: Telugu";
      else if (/[\u0C80-\u0CFF]/.test(val)) langNotice.textContent = "Script: Kannada";
      else if (/[\u0980-\u09FF]/.test(val)) langNotice.textContent = "Script: Bengali";
      else if (/[A-Za-z]/.test(val)) langNotice.textContent = "Script: Latin/English";
      else langNotice.textContent = "Script: Auto";
    }

    function f1_tts() {
      const text = mainInput.value.trim();
      if (!text) { notify("Text is empty."); return; }
      synth.cancel();

      activeUtterance = new SpeechSynthesisUtterance(text);
      const match = voices.find(v => v.voiceURI === voiceSelect.value);
      if (match) {
        activeUtterance.voice = match;
        activeUtterance.lang = match.lang;
      }

      if (highlighterOn) {
        readingDisplay.style.display = "block";
        readingDisplay.textContent = text;
        activeUtterance.onboundary = (e) => {
          if (e.name === 'word') {
            const start = e.charIndex;
            const end = start + (e.charLength || 5);
            readingDisplay.innerHTML = text.substring(0, start) +
              `<span class="active-word">${text.substring(start, end)}</span>` +
              text.substring(end);
          }
        };
      }

      activeUtterance.onstart = () => {
        notify("Speaking text...");
        clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(() => {
          if (!synth.speaking) clearInterval(heartbeatTimer);
          else { synth.pause(); synth.resume(); }
        }, 10000);
      };

      activeUtterance.onend = () => {
        clearInterval(heartbeatTimer);
        readingDisplay.style.display = "none";
        notify("Playback complete.");
      };

      activeUtterance.onerror = () => {
        clearInterval(heartbeatTimer);
        readingDisplay.style.display = "none";
        notify("Speech error.");
      };

      synth.speak(activeUtterance);
    }

    function f2_stt() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) { notify("Dictation unavailable."); return; }

      if (isDictating && recognition) {
        recognition.stop();
        return;
      }

      recognition = new Speech();
      recognition.continuous = true;
      recognition.interimResults = false;

      const match = voices.find(v => v.voiceURI === voiceSelect.value);
      if (match) recognition.lang = match.lang;

      recognition.onstart = () => {
        isDictating = true;
        notify("Listening... Speak now.", [50, 50]);
      };

      recognition.onresult = (e) => {
        let text = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) text += e.results[i][0].transcript;
        }
        if (text) {
          mainInput.value = (mainInput.value ? mainInput.value + " " : "") + text.trim();
          updateStats();
          notify("Added speech text.");
        }
      };

      recognition.onerror = () => { isDictating = false; notify("Dictation error."); };
      recognition.onend = () => { isDictating = false; notify("Dictation stopped."); };
      recognition.start();
    }

    function f3_ocr(e) {
      const file = e.target.files[0];
      if (!file) return;
      notify("Processing image...");

      const img = new Image();
      img.onload = () => {
        const stamp = `\n[Image Scan: ${file.name} | ${img.width}x${img.height} | ${(file.size / 1024).toFixed(1)} KB]`;
        mainInput.value = (mainInput.value ? mainInput.value : "") + stamp;
        updateStats();
        notify("Image info added.");
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
      e.target.value = '';
    }

    function f4_pdf(e) {
      const file = e.target.files[0];
      if (!file) return;
      notify("Parsing PDF...");

      const reader = new FileReader();
      reader.onload = (evt) => {
        const content = evt.target.result;
        const matches = content.match(/\(([^()]+)\)\s*Tj/g) || [];
        let extracted = matches.map(m => m.replace(/[()]/g, '').replace(/Tj/, '').trim()).join(' ');
        if (!extracted || extracted.length < 5) {
          extracted = `[PDF Document: ${file.name} | ${(file.size / 1024).toFixed(1)} KB]`;
        }
        mainInput.value = (mainInput.value ? mainInput.value + "\n" : "") + extracted.slice(0, 10000);
        updateStats();
        notify("PDF text ingested.");
      };
      reader.readAsBinaryString(file);
      e.target.value = '';
    }

    function f5_doc(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        mainInput.value = evt.target.result.slice(0, 10000);
        updateStats();
        notify(`File loaded: ${file.name}`);
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    function f6_translate() {
      const text = mainInput.value.trim();
      if (!text) { notify("Enter text first."); return; }

      const vocabulary = {
        "hello": "नमस्ते (Namaste)", "world": "दुनिया (Duniya)", "book": "किताब (Kitab)",
        "read": "पढ़ना (Padhna)", "water": "पानी (Paani)", "help": "मदद (Madad)",
        "yes": "हाँ (Haan)", "no": "नहीं (Nahi)", "friend": "दोस्त (Dost)", "emergency": "आपातकाल (Aapaatkaal)"
      };

      const out = text.split(/\b/).map(word => {
        const key = word.toLowerCase();
        return vocabulary[key] ? vocabulary[key] : word;
      }).join('');

      mainInput.value = out;
      updateStats();
      notify("Translation applied.");
    }

    function f7_summarize() {
      const text = mainInput.value.trim();
      if (!text) { notify("Enter text first."); return; }

      const sentences = (text.match(/[^.!?\n]+[.!?\n]+/g) || [text]).map(s => s.trim()).filter(s => s.length > 5);
      if (sentences.length <= 2) { notify("Text already compact."); return; }

      const stopWords = new Set(["the","is","in","and","to","of","it","that","you","he","was","for","on","are","as","with"]);
      const freq = {};

      text.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).forEach(w => {
        if (!stopWords.has(w) && w.length > 2) freq[w] = (freq[w] || 0) + 1;
      });

      const scored = sentences.map((s, idx) => {
        let score = 0;
        s.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).forEach(w => {
          if (freq[w]) score += freq[w];
        });
        return { text: s, score: score / (s.split(/\s+/).length + 1), idx };
      });

      const targetCount = Math.max(2, Math.ceil(sentences.length * 0.35));
      const selection = scored.sort((a, b) => b.score - a.score).slice(0, targetCount).sort((a, b) => a.idx - b.idx);

      mainInput.value = selection.map(item => `• ${item.text}`).join('\n\n');
      updateStats();
      notify("Summary generated.");
    }

    function f8_exportAudio() {
      const text = mainInput.value.trim();
      if (!text) { notify("Buffer empty."); return; }

      notify("Rendering audio WAV...");
      const formants = { 'a': [800, 1200], 'e': [500, 1800], 'i': [300, 2300], 'o': [500, 1000], 'u': [350, 800] };
      const sampleRate = 16000;
      const phonemeDur = 0.14;
      const samplesPerPhoneme = Math.floor(sampleRate * phonemeDur);
      const chars = text.toLowerCase().replace(/[^a-z\s]/g, '').slice(0, 120).split('');
      if (!chars.length) chars.push('a');

      const totalSamples = samplesPerPhoneme * chars.length;
      const buffer = new ArrayBuffer(44 + totalSamples * 2);
      const view = new DataView(buffer);

      function wStr(offset, str) { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); }
      wStr(0, 'RIFF'); view.setUint32(4, 36 + totalSamples * 2, true);
      wStr(8, 'WAVE'); wStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      wStr(36, 'data');
      view.setUint32(40, totalSamples * 2, true);

      let offset = 44;
      for (let c = 0; c < chars.length; c++) {
        const [f1, f2] = formants[chars[c]] || [600, 1400];
        for (let i = 0; i < samplesPerPhoneme; i++) {
          const t = i / sampleRate;
          const glottal = Math.sin(2 * Math.PI * 130 * t);
          const res1 = Math.sin(2 * Math.PI * f1 * t);
          const res2 = Math.sin(2 * Math.PI * f2 * t);
          const s = (glottal * 0.4 + res1 * 0.4 + res2 * 0.2) * Math.sin((Math.PI * i) / samplesPerPhoneme);
          view.setInt16(offset, Math.max(-1, Math.min(1, s)) * 0x7FFF, true);
          offset += 2;
        }
      }

      cachedWavBlob = new Blob([buffer], { type: 'audio/wav' });
      const url = URL.createObjectURL(cachedWavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'blind_tech_audio.wav';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
      notify("WAV downloaded.");
    }

    async function f9_share() {
      const text = mainInput.value.trim();
      if (!text) { notify("Enter text to share."); return; }

      if (navigator.share) {
        try {
          await navigator.share({ title: 'Blind Tech Export', text: text });
          notify("Share sheet opened.");
        } catch (e) {
          if (e.name !== 'AbortError') notify("Share cancelled.");
        }
      } else {
        notify("Share API unavailable.");
      }
    }

    async function f10_paste() {
      try {
        const clip = await navigator.clipboard.readText();
        if (!clip) { notify("Clipboard empty."); return; }
        mainInput.value = (mainInput.value + " " + clip).slice(0, 10000).trim();
        updateStats();
        notify("Clipboard pasted.");
      } catch (err) {
        mainInput.focus();
        notify("Hold box to paste manually.");
      }
    }

    function f11_magnifier() {
      fontIdx = (fontIdx + 1) % fontSizes.length;
      const sz = fontSizes[fontIdx];
      mainInput.style.fontSize = sz + "px";
      readingDisplay.style.fontSize = sz + "px";
      notify(`Font zoom: ${sz}px`);
    }

    function f12_theme() {
      const doc = document.documentElement;
      const cur = doc.getAttribute('data-theme');
      const target = cur === 'light' ? 'dark' : 'light';
      doc.setAttribute('data-theme', target);
      notify(`Theme
