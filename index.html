<!DOCTYPE html>
<html lang="en" data-theme="high-contrast">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="description" content="Blind Tech Foundation - Accessible Application Suite for Visually Impaired Users." />
  <meta name="theme-color" content="#ffd700" />
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Blind%20Tech%20Foundation%22%2C%22short_name%22%3A%22BlindTech%22%2C%22start_url%22%3A%22.%2Findex.html%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23ffd700%22%7D" />

  <title>Blind Tech Foundation</title>

  <!-- External Client Libraries for OCR and Client-side Python Execution -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --surface-variant: #1e1e1e;
      --card: #181818;
      --text: #ffffff;
      --text-muted: #e0e0e0;
      --primary: #ffd700;
      --primary-text: #000000;
      --secondary: #00ffff;
      --border: #ffd700;
      --focus-ring: #00ffff;
      --error: #ff4d4d;
      --success: #00ff66;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-variant: #282828;
      --card: #242424;
      --text: #f0f0f0;
      --text-muted: #b0b0b0;
      --primary: #ffd700;
      --primary-text: #121212;
      --secondary: #80d8ff;
      --border: #666666;
      --focus-ring: #ffd700;
      --error: #cf6679;
      --success: #03dac6;
    }
    [data-theme="light"] {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --surface-variant: #f1f3f4;
      --card: #ffffff;
      --text: #121212;
      --text-muted: #444444;
      --primary: #b27b00;
      --primary-text: #ffffff;
      --secondary: #006699;
      --border: #767676;
      --focus-ring: #0056b3;
      --error: #b00020;
      --success: #007a33;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      font-size: 18px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    *:focus-visible {
      outline: 4px solid var(--focus-ring) !important;
      outline-offset: 3px !important;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #screenCurtain {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 99999;
    }
    header.app-bar {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      gap: 10px;
    }
    .app-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      min-width: 48px;
      min-height: 48px;
      background: var(--surface-variant);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
    }
    .icon-btn:hover {
      background: var(--primary);
      color: var(--primary-text);
    }
    #sideDrawer {
      position: fixed;
      top: 0;
      left: -330px;
      width: 310px;
      height: 100vh;
      background: var(--surface);
      border-right: 3px solid var(--border);
      z-index: 10000;
      transition: left 0.25s ease-in-out;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
    }
    #sideDrawer.open {
      left: 0;
    }
    .drawer-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
    }
    .drawer-overlay.active {
      display: block;
    }
    .drawer-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 14px;
    }
    .drawer-link {
      min-height: 48px;
      background: var(--surface-variant);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .drawer-link:hover {
      background: var(--primary);
      color: var(--primary-text);
    }
    main {
      flex: 1;
      padding: 16px;
      padding-bottom: 96px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .view-panel {
      display: none;
    }
    .view-panel.active {
      display: block;
    }
    h1, h2, h3 {
      color: var(--primary);
      margin-bottom: 12px;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .action-card {
      cursor: pointer;
      display: block;
      width: 100%;
      text-align: left;
      min-height: 64px;
    }
    .action-card:hover {
      background: var(--surface-variant);
      border-color: var(--secondary);
    }
    .btn {
      min-height: 48px;
      min-width: 48px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid var(--border);
      background: var(--primary);
      color: var(--primary-text);
      margin: 4px 0;
    }
    .btn-secondary {
      background: var(--surface-variant);
      color: var(--text);
    }
    .btn-danger {
      background: var(--error);
      color: #ffffff;
      border-color: #ffffff;
    }
    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-weight: 600;
      color: var(--text);
    }
    input, select, textarea {
      min-height: 48px;
      padding: 10px 12px;
      font-size: 1.05rem;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
      width: 100%;
      font-family: inherit;
    }
    .tabs-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
    }
    .tab-btn {
      flex: 1;
      min-height: 48px;
      padding: 8px 10px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--primary);
      color: var(--primary-text);
    }
    .output-box {
      background: var(--surface-variant);
      border: 2px solid var(--border);
      padding: 14px;
      border-radius: 6px;
      margin-top: 10px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 1rem;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      background: var(--surface);
      border-top: 3px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 4px;
      z-index: 1000;
    }
    .nav-btn {
      flex: 1;
      min-height: 52px;
      background: transparent;
      border: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      gap: 2px;
    }
    .nav-btn.active {
      background: var(--surface-variant);
      color: var(--primary);
      border: 2px solid var(--border);
    }
    .fab-voice {
      position: fixed;
      bottom: 74px;
      right: 18px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--primary-text);
      border: 3px solid #000;
      font-size: 1.6rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="screenCurtain" aria-hidden="true"></div>
  <div id="liveAnnouncer" class="sr-only" aria-live="assertive"></div>
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>

  <div id="sideDrawer" role="dialog" aria-label="Main Navigation Menu">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size: 1.25rem;">Foundation Tools</h2>
      <button class="icon-btn" onclick="toggleDrawer(false)" aria-label="Close navigation menu">✕</button>
    </div>
    <nav class="drawer-nav">
      <button class="drawer-link" onclick="navigate('home')">1. Home Dashboard</button>
      <button class="drawer-link" onclick="navigate('ocr')">2. Advanced OCR Hub</button>
      <button class="drawer-link" onclick="navigate('reading')">3. Universal Reading Hub</button>
      <button class="drawer-link" onclick="navigate('ide')">4. Accessible Code IDE</button>
      <button class="drawer-link" onclick="navigate('banking')">5. Banking Tools</button>
      <button class="drawer-link" onclick="navigate('finance')">6. Finance & Money Tools</button>
      <button class="drawer-link" onclick="navigate('education')">7. Education & Exam Hub</button>
      <button class="drawer-link" onclick="navigate('study')">8. Study Tools & Summarizer</button>
      <button class="drawer-link" onclick="navigate('navigation')">9. Navigation Assistant</button>
      <button class="drawer-link" onclick="navigate('health')">10. Health & Wellness</button>
      <button class="drawer-link" onclick="navigate('daily')">11. Daily Tasks & Calculator</button>
      <button class="drawer-link" onclick="navigate('agriculture')">12. Agriculture Assistant</button>
      <button class="drawer-link" onclick="navigate('legal')">13. Legal & RPwD Schemes</button>
      <button class="drawer-link" onclick="navigate('media')">14. Media Tools</button>
      <button class="drawer-link" onclick="navigate('articles')">15. Articles & Tutorials</button>
      <button class="drawer-link" onclick="navigate('news')">16. Daily News Feed</button>
      <button class="drawer-link" onclick="navigate('vault')">17. Smart Software Vault</button>
      <button class="drawer-link" onclick="navigate('community')">18. Community & Support</button>
    </nav>
  </div>

  <header class="app-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="icon-btn" onclick="toggleDrawer(true)" aria-label="Open Navigation Drawer Menu">☰</button>
      <span class="app-title">Blind Tech</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="cycleTheme()" aria-label="Switch Theme Mode">🎨</button>
      <button class="icon-btn" onclick="toggleScreenCurtain()" aria-label="Toggle Screen Curtain Privacy Mode">🕶️</button>
      <button class="icon-btn" onclick="stopAllSpeech()" aria-label="Stop all active audio and reading">⏹️</button>
    </div>
  </header>

  <main>
    <!-- Screen 1: Home Dashboard -->
    <section id="view-home" class="view-panel active" aria-labelledby="h-home">
      <h1 id="h-home">Quick Tools Access</h1>
      <button class="card action-card" onclick="navigate('ocr')">
        <h2>📷 Advanced OCR & Scene Hub</h2>
        <p>Real-time optical character recognition, camera snapshot extraction, and image analysis.</p>
      </button>
      <button class="card action-card" onclick="navigate('reading')">
        <h2>📖 Universal AI Reading Hub</h2>
        <p>Accessible document reader with live play, pause, resume, skip, and rewind controls.</p>
      </button>
      <button class="card action-card" onclick="navigate('banking')">
        <h2>🏦 Banking Form Assistant</h2>
        <p>Voice-guided banking form with digit confirmation and currency conversion.</p>
      </button>
      <button class="card action-card" onclick="navigate('finance')">
        <h2>💰 Finance & Money Tools</h2>
        <p>Live EMI calculator, SIP compound maturity planner, and persistent expense tracker.</p>
      </button>
      <button class="card action-card" onclick="navigate('ide')">
        <h2>💻 Accessible Code IDE</h2>
        <p>In-browser code runner for Python, JavaScript, HTML, and C++ with spoken terminal execution.</p>
      </button>
      <button class="card action-card" onclick="navigate('education')">
        <h2>🎓 Competitive Exam Hub</h2>
        <p>Functional preparation modules for UPSC, SSC, Banking, UGC NET, and AI Q&A generation.</p>
      </button>
      <button class="card action-card" onclick="confirmSOS()">
        <h2 style="color:var(--error);">🚨 Emergency SOS (112)</h2>
        <p>Fast emergency shortcut with safety confirmation to prevent accidental dials.</p>
      </button>
    </section>

    <!-- Screen 2: Advanced OCR & Scene Hub -->
    <section id="view-ocr" class="view-panel" aria-labelledby="h-ocr">
      <h1 id="h-ocr">Advanced OCR & Scene Hub</h1>
      <div class="card">
        <div class="form-group">
          <label for="ocrLang">Select Recognition Language</label>
          <select id="ocrLang">
            <option value="eng">English (eng)</option>
            <option value="hin">Hindi (hin)</option>
            <option value="tam">Tamil (tam)</option>
            <option value="tel">Telugu (tel)</option>
            <option value="kan">Kannada (kan)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ocrFileInput">Select or Capture Image File</label>
          <input type="file" id="ocrFileInput" accept="image/*" onchange="previewOCRImage(event)" />
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn" onclick="executeRealOCR()">Extract Text (Alt+P)</button>
          <button class="btn btn-secondary" onclick="analyzeSceneContent()">Describe Image Scene</button>
        </div>
        <div id="ocrStatus" style="margin-top:8px; font-weight:bold; color:var(--primary);" aria-live="polite"></div>
      </div>
      <div class="card">
        <label for="ocrResultText">Extracted Editable Text</label>
        <textarea id="ocrResultText" rows="6" placeholder="Extracted text will appear here..."></textarea>
        <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
          <button class="btn" onclick="speakText(document.getElementById('ocrResultText').value)">Read Aloud</button>
          <button class="btn btn-secondary" onclick="copyToClipboard('ocrResultText')">Copy Text</button>
          <button class="btn btn-secondary" onclick="shareExtractedText()">Share Text</button>
        </div>
      </div>
    </section>

    <!-- Screen 3: Universal Reading Hub -->
    <section id="view-reading" class="view-panel" aria-labelledby="h-reading">
      <h1 id="h-reading">Universal Reading Hub</h1>
      <div class="card">
        <div class="form-group">
          <label for="readerSpeed">Reading Speed: <span id="speedLabel">1.0x</span></label>
          <input type="range" id="readerSpeed" min="0.5" max="2.5" step="0.25" value="1.0" oninput="updateSpeechRate(this.value)" />
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn" onclick="startDocumentReading()">Play Aloud (Alt+R)</button>
          <button class="btn btn-secondary" onclick="pauseDocumentReading()">Pause</button>
          <button class="btn btn-secondary" onclick="resumeDocumentReading()">Resume</button>
          <button class="btn btn-secondary" onclick="rewindDocumentParagraph()">Rewind</button>
          <button class="btn btn-secondary" onclick="skipDocumentParagraph()">Skip</button>
          <button class="btn btn-secondary" onclick="stopAllSpeech()">Stop</button>
        </div>
      </div>
      <div class="card">
        <div class="form-group">
          <label for="readingFileInput">Import File (TXT, MD, HTML, CSV)</label>
          <input type="file" id="readingFileInput" accept=".txt,.md,.html,.csv,.json" onchange="handleRealDocumentImport(event)" />
        </div>
        <label for="readingDocumentText">Document Content</label>
        <textarea id="readingDocumentText" rows="8">The Rights of Persons with Disabilities (RPwD) Act, 2016 gives effect to the United Nations Convention on the Rights of Persons with Disabilities.

It guarantees equality, accessibility in all public infrastructure, and reservations in government employment and higher education throughout India.</textarea>
      </div>
    </section>

    <!-- Screen 4: Accessible Code IDE -->
    <section id="view-ide" class="view-panel" aria-labelledby="h-ide">
      <h1 id="h-ide">Accessible Code IDE</h1>
      <div class="card">
        <div class="form-group">
          <label for="ideLang">Select Language</label>
          <select id="ideLang" onchange="handleIDELanguageChange()">
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="html">HTML</option>
            <option value="cpp">C++ (Simulation Mode)</option>
          </select>
        </div>
        <label for="codeEditor">Source Code</label>
        <textarea id="codeEditor" rows="8" style="font-family:monospace;">def solve():
    return "Hello from Blind Tech Functional IDE!"

print(solve())</textarea>
        <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
          <button class="btn" onclick="executeRealCode()">Run Code (Alt+E)</button>
          <button class="btn btn-secondary" onclick="saveCodeToFile()">Save Script</button>
          <button class="btn btn-secondary" onclick="document.getElementById('codeOpenInput').click()">Open File</button>
          <input type="file" id="codeOpenInput" style="display:none;" onchange="openCodeFromFile(event)" />
          <button class="btn btn-secondary" onclick="copyToClipboard('codeEditor')">Copy Code</button>
        </div>
      </div>
      <div class="card">
        <h2>Terminal & Error Output</h2>
        <div id="terminalOutput" class="output-box" tabindex="0">Terminal ready. Press "Run Code" to execute.</div>
      </div>
    </section>

    <!-- Screen 5: Banking Tools -->
    <section id="view-banking" class="view-panel" aria-labelledby="h-banking">
      <h1 id="h-banking">Banking Form Assistant</h1>
      <div class="card">
        <div class="form-group">
          <label for="bName">Beneficiary Full Name</label>
          <input type="text" id="bName" placeholder="Enter Full Name" onfocus="speakText('Enter beneficiary full name.')" />
        </div>
        <div class="form-group">
          <label for="bAccount">Account Number (Digits Only)</label>
          <input type="text" id="bAccount" inputmode="numeric" oninput="handleAccountInput(this)" placeholder="e.g. 1029384756" onfocus="speakText('Enter account number. Each digit will be confirmed as you type.')" />
        </div>
        <div class="form-group">
          <label for="bType">Transaction Type</label>
          <select id="bTyp
