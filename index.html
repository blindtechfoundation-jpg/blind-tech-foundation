<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hill Climb Racing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #111;
            overflow: hidden;
            font-family: sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        .bar-container {
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        #fuelBar {
            width: 100%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.1s linear;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            pointer-events: none;
        }
        .btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #fff;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #fff;
        }
        #gameOverScreen h1 {
            margin-bottom: 15px;
            color: #e74c3c;
        }
        #restartBtn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 18px;
            font-weight: bold;
            background: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="ui">
    <div>Distance: <span id="distVal">0</span> m</div>
    <div>Coins: <span id="coinVal">0</span></div>
    <div class="bar-container">
        <div id="fuelBar"></div>
    </div>
</div>

<div id="controls">
    <div class="btn" id="brakeBtn">BRAKE</div>
    <div class="btn" id="gasBtn">GAS</div>
</div>

<div id="gameOverScreen">
    <h1 id="failReason">GAME OVER</h1>
    <p>Distance Reached: <span id="finalDist">0</span> m</p>
    <p>Coins Collected: <span id="finalCoins">0</span></p>
    <button id="restartBtn" onclick="restartGame()">RESTART</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const { Engine, World, Bodies, Body, Constraint, Composite } = Matter;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

window.addEventListener("resize", () => {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
});

let engine, world;
let chassis, wheelBack, wheelFront, driverHead;
let terrainSegments = [];
let coins = [];
let fuelCans = [];

let keys = { gas: false, brake: false };
let fuel = 100;
let coinCount = 0;
let maxDistance = 0;
let isGameOver = false;

let nextTerrainX = 0;
let nextTerrainY = 400;

function initGame() {
    engine = Engine.create();
    world = engine.world;
    world.gravity.y = 1.3;

    terrainSegments = [];
    coins = [];
    fuelCans = [];
    fuel = 100;
    coinCount = 0;
    maxDistance = 0;
    isGameOver = false;
    document.getElementById("gameOverScreen").style.display = "none";

    nextTerrainX = -500;
    nextTerrainY = height * 0.65;

    for (let i = 0; i < 40; i++) {
        generateTerrainChunk();
    }

    createCar(150, height * 0.4);
}

function createCar(x, y) {
    chassis = Bodies.rectangle(x, y, 110, 30, {
        collisionFilter: { group: -1 },
        density: 0.003,
        friction: 0.8
    });

    driverHead = Bodies.circle(x, y - 28, 14, {
        collisionFilter: { group: -1 },
        density: 0.001
    });

    const headJoint = Constraint.create({
        bodyA: chassis,
        pointA: { x: 0, y: -25 },
        bodyB: driverHead,
        pointB: { x: 0, y: 0 },
        stiffness: 1,
        length: 0
    });

    wheelBack = Bodies.circle(x - 40, y + 25, 20, {
        collisionFilter: { group: -1 },
        friction: 1.0,
        density: 0.004
    });

    wheelFront = Bodies.circle(x + 40, y + 25, 20, {
        collisionFilter: { group: -1 },
        friction: 1.0,
        density: 0.004
    });

    const axelBack = Constraint.create({
        bodyA: chassis,
        pointA: { x: -40, y: 15 },
        bodyB: wheelBack,
        length: 15,
        stiffness: 0.2,
        damping: 0.8
    });

    const axelFront = Constraint.create({
        bodyA: chassis,
        pointA: { x: 40, y: 15 },
        bodyB: wheelFront,
        length: 15,
        stiffness: 0.2,
        damping: 0.8
    });

    World.add(world, [chassis, driverHead, headJoint, wheelBack, wheelFront, axelBack, axelFront]);
}

function generateTerrainChunk() {
    const step = 80;
    const endX = nextTerrainX + step;
    const roughness = Math.min(Math.max((nextTerrainX / 1000) * 15, 20), 120);
    const endY = height * 0.65 + Math.sin(nextTerrainX * 0.005) * roughness + (Math.random() - 0.5) * 35;

    const midX = (nextTerrainX + endX) / 2;
    const midY = (nextTerrainY + endY) / 2;
    const length = Math.hypot(endX - nextTerrainX, endY - nextTerrainY);
    const angle = Math.atan2(endY - nextTerrainY, endX - nextTerrainX);

    const segment = Bodies.rectangle(midX, midY, length, 40, {
        isStatic: true,
        angle: angle,
        friction: 0.9
    });

    terrainSegments.push({ body: segment, x1: nextTerrainX, y1: nextTerrainY, x2: endX, y2: endY });
    World.add(world, segment);

    if (nextTerrainX > 400 && Math.random() < 0.25) {
        coins.push({ x: midX, y: midY - 45, collected: false });
    } else if (nextTerrainX > 400 && Math.random() < 0.08) {
        fuelCans.push({ x: midX, y: midY - 45, collected: false });
    }

    nextTerrainX = endX;
    nextTerrainY = endY;
}

window.addEventListener("keydown", (e) => {
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.gas = true;
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.brake = true;
});

window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.gas = false;
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.brake = false;
});

const gasBtn = document.getElementById("gasBtn");
const brakeBtn = document.getElementById("brakeBtn");

gasBtn.addEventListener("touchstart", (e) => { e.preventDefault(); keys.gas = true; });
gasBtn.addEventListener("touchend", () => { keys.gas = false; });
gasBtn.addEventListener("mousedown", () => { keys.gas = true; });
gasBtn.addEventListener("mouseup", () => { keys.gas = false; });

brakeBtn.addEventListener("touchstart", (e) => { e.preventDefault(); keys.brake = true; });
brakeBtn.addEventListener("touchend", () => { keys.brake = false; });
brakeBtn.addEventListener("mousedown", () => { keys.brake = true; });
brakeBtn.addEventListener("mouseup", () => { keys.brake = false; });

function applyCarPhysics() {
    if (isGameOver) return;

    if (keys.gas && fuel > 0) {
        Body.setAngularVelocity(wheelBack, 0.4);
        Body.setAngularVelocity(wheelFront, 0.4);
        chassis.torque = -0.04;
        fuel -= 0.08;
    }

    if (keys.brake) {
        Body.setAngularVelocity(wheelBack, -0.2);
        Body.setAngularVelocity(wheelFront, -0.2);
        chassis.torque = 0.04;
        if (fuel > 0) fuel -= 0.02;
    }

    if (fuel > 0) {
        fuel -= 0.015;
    } else {
        fuel = 0;
        if (Math.abs(chassis.velocity.x) < 0.05 && Math.abs(chassis.velocity.y) < 0.05) {
            triggerGameOver("OUT OF FUEL");
        }
    }

    for (let seg of terrainSegments) {
        const dX = driverHead.position.x - seg.body.position.x;
        const dY = driverHead.position.y - seg.body.position.y;
        if (Math.hypot(dX, dY) < 30) {
            triggerGameOver("DRIVER DOWN");
            break;
        }
    }

    coins.forEach(c => {
        if (!c.collected && Math.hypot(chassis.position.x - c.x, chassis.position.y - c.y) < 50) {
            c.collected = true;
            coinCount += 5;
        }
    });

    fuelCans.forEach(f => {
        if (!f.collected && Math.hypot(chassis.position.x - f.x, chassis.position.y - f.y) < 50) {
            f.collected = true;
            fuel = Math.min(100, fuel + 40);
        }
    });

    const dist = Math.max(0, Math.floor((chassis.position.x - 150) / 10));
    if (dist > maxDistance) maxDistance = dist;

    document.getElementById("distVal").innerText = maxDistance;
    document.getElementById("coinVal").innerText = coinCount;
    document.getElementById("fuelBar").style.width = fuel + "%";

    while (chassis.position.x + width > nextTerrainX) {
        generateTerrainChunk();
    }

    if (terrainSegments.length > 80) {
        const removed = terrainSegments.shift();
        World.remove(world, removed.body);
    }
}

function triggerGameOver(reason) {
    if (isGameOver) return;
    isGameOver = true;
    document.getElementById("failReason").innerText = reason;
    document.getElementById("finalDist").innerText = maxDistance;
    document.getElementById("finalCoins").innerText = coinCount;
    document.getElementById("gameOverScreen").style.display = "block";
}

function restartGame() {
    World.clear(world);
    Engine.clear(engine);
    initGame();
}

function render() {
    ctx.clearRect(0, 0, width, height);

    ctx.save();
    const camX = width * 0.3 - chassis.position.x;
    const camY = height * 0.6 - chassis.position.y;
    ctx.translate(camX, camY);

    ctx.fillStyle = "#27ae60";
    ctx.strokeStyle = "#1e8449";
    ctx.lineWidth = 4;
    terrainSegments.forEach(seg => {
        ctx.beginPath();
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
        ctx.lineTo(seg.x2, seg.y2 + 400);
        ctx.lineTo(seg.x1, seg.y1 + 400);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
        ctx.stroke();
    });

    coins.forEach(c => {
        if (!c.collected) {
            ctx.fillStyle = "#f1c40f";
            ctx.strokeStyle = "#d4ac0d";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }
    });

    fuelCans.forEach(f => {
        if (!f.collected) {
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(f.x - 8, f.y - 12, 16, 24);
            ctx.fillStyle = "#fff";
            ctx.font = "10px sans-serif";
            ctx.fillText("GAS", f.x - 10, f.y + 4);
        }
    });

    ctx.save();
    ctx.translate(chassis.position.x, chassis.position.y);
    ctx.rotate(chassis.angle);
    ctx.fillStyle = "#e67e22";
    ctx.fillRect(-55, -15, 110, 30);
    ctx.restore();

    ctx.save();
    ctx.translate(driverHead.position.x, driverHead.position.y);
    ctx.rotate(driverHead.angle);
    ctx.fillStyle = "#f39c12";
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const drawWheel = (w) => {
        ctx.save();
        ctx.translate(w.position.x, w.position.y);
        ctx.rotate(w.angle);
        ctx.fillStyle = "#333";
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#777";
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(15, 0);
        ctx.moveTo(0, -15);
        ctx.lineTo(0, 15);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
    };

    drawWheel(wheelBack);
    drawWheel(wheelFront);

    ctx.restore();
}

function gameLoop() {
    Engine.update(engine, 1000 / 60);
    applyCarPhysics();
    render();
    requestAnimationFrame(gameLoop);
}

initGame();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
